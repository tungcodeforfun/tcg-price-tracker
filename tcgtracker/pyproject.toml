[project]
name = "tcgtracker"
version = "0.1.0"
description = "TCG Price Tracker for Pokemon and One Piece cards"
readme = "README.md"
authors = [
    { name = "Tung Nguyen", email = "tungnguyen1651@gmail.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.3.0",
    "PyJWT>=2.15.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "click>=8.5.0",
    "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "black>=26.5.1",
    "flake8>=7.4.1",
    "mypy>=2.3.1",
    "isort>=9.0.1",
    "pre-commit>=4.6.2",
    "bandit>=1.9.4",
    "safety>=3.8.1",
]

[project.scripts]
tcgtracker = "tcgtracker:main"
tcg-cli = "tcgtracker.cli:cli"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=tcgtracker --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
