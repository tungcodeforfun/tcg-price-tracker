services:
  # Main application service
  tcg-tracker:
    build:
      context: ./tcgtracker
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_RELOAD=${APP_RELOAD:-true}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-DEBUG}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tcgtracker}
      - DB_USER=${DB_USER:-tcgtracker}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - SECURITY_SECRET_KEY=${SECURITY_SECRET_KEY}
      - API_JUSTTCG_API_KEY=${API_JUSTTCG_API_KEY}
      - API_PRICECHARTING_API_KEY=${API_PRICECHARTING_API_KEY}
      - API_PRICECHARTING_RATE_LIMIT=${API_PRICECHARTING_RATE_LIMIT:-60}
      - API_EBAY_ENVIRONMENT=${API_EBAY_ENVIRONMENT:-sandbox}
      - API_EBAY_CLIENT_ID=${API_EBAY_CLIENT_ID}
      - API_EBAY_CLIENT_SECRET=${API_EBAY_CLIENT_SECRET}
      - API_EBAY_SANDBOX_CLIENT_ID=${API_EBAY_SANDBOX_CLIENT_ID}
      - API_EBAY_SANDBOX_CLIENT_SECRET=${API_EBAY_SANDBOX_CLIENT_SECRET}
      - API_EBAY_VERIFICATION_TOKEN=${API_EBAY_VERIFICATION_TOKEN}
      - API_EBAY_DELETION_ENDPOINT=${API_EBAY_DELETION_ENDPOINT}
    volumes:
      - ./tcgtracker/src:/app/src
      - ./tcgtracker/tests:/app/tests
    depends_on:
      - postgres
      - redis
    networks:
      - tcg-network
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-tcgtracker}
      - POSTGRES_USER=${DB_USER:-tcgtracker}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - tcg-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tcg-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  tcg-network:
    driver: bridge